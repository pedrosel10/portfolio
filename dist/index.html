<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Portfolio</title>
  <meta name="theme-color" content="#B16B3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">
  <style>
    @media (max-width: 768px) {
      #portfolio-view>div {
        padding: 60px 0 !important;
        gap: 40px !important;
      }

      #portfolio-view img {
        max-width: 60% !important;
        border-radius: 8px !important;
      }

      #toggle-fold {
        bottom: 20px !important;
        font-size: 14px !important;
        padding: 10px 20px !important;
      }
    }

    .glass-btn {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 0.5px 1px rgba(255, 255, 255, 0.3),
        inset 0 -0.5px 1px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), background 0.3s ease;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass-btn:active {
      transform: translateX(-50%) scale(0.92);
      background: rgba(0, 0, 0, 0.5);
    }

    .glass-btn-text {
      font-family: 'Playfair Display', serif;
      font-size: 11px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 1px;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
      position: absolute;
      text-align: center;
      line-height: 1.3;
      width: 100%;
      padding: 0 4px;
    }

    .slide-up-out {
      transform: translateY(-150%);
      opacity: 0;
    }

    .slide-down-in {
      transform: translateY(150%);
      opacity: 0;
    }

    .slide-normal {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BO_YoiS_.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BSVkoOKx.css">
</head>

<body>
  <div id="loading-screen"
    style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(to top, #B16B3E 20%, #7d4422 100%); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease;">
    <div class="loader"></div>
    <p
      style="font-family: 'Playfair Display', serif; margin-top: 24px; font-size: 14px; letter-spacing: 4px; color: #ffffff;">
      CARREGANDO</p>
  </div>

  <div id="app"></div>

  <div id="top-logo">PORTFOLIO</div>

  <div id="global-action-btn" class="glass-btn">
    <div id="global-action-text" class="glass-btn-text slide-normal">Abrir</div>
  </div>

  <!-- Transition Layer for Crossfade -->
  <div id="transition-layer"
    style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000; z-index:999; opacity:0; pointer-events:none;">
  </div>
  <div id="portfolio-view"
    style="display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; overflow-y: auto; background: transparent; opacity: 0; pointer-events: none;">
    <div
      style="display: flex; flex-direction: column; align-items: center; padding: 100px 0; gap: 80px; max-width: 1200px; margin: 0 auto;">
      <img src="./12802.webp"
        style="max-width: 60%; width: 100%; object-fit: cover; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);" />
      <img src="./1644.webp"
        style="max-width: 60%; width: 100%; object-fit: cover; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);" />
      <img src="./29038.webp"
        style="max-width: 60%; width: 100%; object-fit: cover; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);" />
      <img src="./12802.webp"
        style="max-width: 60%; width: 100%; object-fit: cover; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);" />
    </div>
  </div>
</body>

</html>
