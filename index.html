<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Portfolio</title>
  <meta name="theme-color" content="#B16B3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    @media (max-width: 768px) {
      #portfolio-view>div {
        padding: 60px 0 !important;
        gap: 40px !important;
      }

      #portfolio-view img,
      #portfolio-view .placeholder-project {
        max-width: 60% !important;
        border-radius: 8px !important;
      }

      .placeholder-project {
        font-size: 16px !important;
      }

      #toggle-fold {
        bottom: 20px !important;
        font-size: 14px !important;
        padding: 10px 20px !important;
      }
    }

    .glass-btn {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 0.5px 1px rgba(255, 255, 255, 0.3),
        inset 0 -0.5px 1px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), background 0.3s ease;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    .glass-btn:active {
      transform: translateX(-50%) scale(0.92);
      background: rgba(0, 0, 0, 0.5);
    }



    .placeholder-project {
      max-width: 60%;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #111111;
      border: 1px dashed #333;
      border-radius: 15px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'CooperLtBT', serif;
      font-size: 24px;
      color: #444;
      letter-spacing: 4px;
    }
  </style>
</head>

<body>
  <div id="loading-screen"
    style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #B16B3E; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease;">
    <div class="loader"></div>
    <p
      style="font-family: 'Playfair Display', serif; margin-top: 24px; font-size: 14px; letter-spacing: 4px; color: #ffffff;">
      CARREGANDO</p>
  </div>

  <div id="app"></div>

  <div id="top-logo">PORTFOLIO</div>

  <div id="global-action-btn" class="glass-btn">
    <svg id="global-action-icon" width="34" height="34" viewBox="0 0 171 171" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path id="icon-path-1" stroke="white" stroke-width="25" stroke-linejoin="round" d="M 22.37 103.70 C 22.37 103.70, 41.59 75.77, 41.59 75.77 C 41.59 75.77, 60.82 47.83, 60.82 47.83 C 60.82 47.83, 80.04 19.90, 80.04 19.90" />
      <path id="icon-path-2" stroke="white" stroke-width="25" stroke-linejoin="round" d="M 31.21 122.03 C 31.21 122.03, 65.30 124.37, 65.30 124.37 C 65.30 124.37, 99.38 126.72, 99.38 126.72 C 99.38 126.72, 133.47 129.06, 133.47 129.06" />
      <path id="icon-path-3" stroke="white" stroke-width="25" stroke-linejoin="round" d="M 100.51 21.48 C 100.51 21.48, 115.12 52.02, 115.12 52.02 C 115.12 52.02, 129.72 82.56, 129.72 82.56 C 129.72 82.56, 144.33 113.10, 144.33 113.10" />
    </svg>
  </div>

  <!-- Transition Layer for Crossfade -->
  <div id="transition-layer"
    style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000; z-index:999; opacity:0; pointer-events:none;">
  </div>
  <div id="portfolio-view"
    style="display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; overflow-y: auto; background: transparent; opacity: 0; pointer-events: none;">
    <div
      style="display: flex; flex-direction: column; align-items: center; padding: 100px 0; gap: 80px; max-width: 1200px; margin: 0 auto;">
      <div class="placeholder-project">EM BREVE</div>
      <div class="placeholder-project">EM BREVE</div>
      <div class="placeholder-project">EM BREVE</div>
      <div class="placeholder-project">EM BREVE</div>
      <div class="placeholder-project">EM BREVE</div>
      <div class="placeholder-project">EM BREVE</div>
    </div>
  </div>
  <div id="tv-noise"><div class="tv-static"></div></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
